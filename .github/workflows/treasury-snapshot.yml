# 金库账本快照 —— 与 boards-snapshot 不同源不同产物：本 job 只写 data/treasury.json，
# 唯一写入者是它自己（muse-mini 不碰这个文件），单跑 <1 分钟，不会重演 boards 那个
# 「运行时长 = 间隔」的排队丢弃事故。存在的根因：官方 RPC 的 CORS 间歇性坏，
# 浏览器读不了链，账本必须有服务器侧的快照兜底。
name: treasury-snapshot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: treasury-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/treasury-ledger.mjs
      # 标准代币清单 + logo 落地 —— 让 fomo / GMGN / GT 这类聚合器有地方读我们的图。
      # 依赖 data/ours.json（由 muse-mini 的 cron 写），所以只读不写它，互不打架。
      - run: node scripts/tokenlist.mjs
      - name: commit if changed
        run: |
          git config user.name dbc-bot
          git config user.email bot@dontblink.community
          git add data/treasury.json data/tokenlist.json logos
          git diff --cached --quiet || git commit -m "treasury snapshot + token list"
          git push
