# Refresh /data/boards.json every ~10 min. Pages rebuilds on each commit;
# the legacy branch build has a ~10 builds/hour soft limit, so keep the cron
# at 10 min or slower.
name: boards-snapshot
on:
  # **定时已停用(2026-08-28),这个仓的数据现在由 muse-mini 上的 cron 写。**
  #
  # 停用的原因不是 GitHub 有问题,是这个 job 本身:单次运行中位 8.7 分钟,和它自己配的
  # 10 分钟间隔一样长,加上 concurrency 不取消,排队的定时运行被 GitHub 丢弃。实测中位
  # 间隔 126 分钟、最长 2071 分钟(34 小时)—— 站点的币列表和行情因此长期停在一天前,
  # 而没有任何地方会说出来。
  #
  # **同一份产物只能有一个写入者。** 两边都定时的话,谁覆盖谁取决于时序,而且两边
  # 都不会报错。muse-mini 那边:/etc/cron.d/dbc-snapshot,脚本 /opt/dbc/run.sh。
  #
  # workflow_dispatch 保留:muse-mini 挂了的时候手点一下仍然能出一份数据。
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boards-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/snapshot.mjs
      # 我们自己发出去的币（v1 存档 + 链上增量 + v2 Portal 事件 + GT 行情）
      - run: node scripts/ours.mjs
      # 全站累计成交量。**增量**:每轮只刷一批池子(1057 个,GT 免费档第 3 批就 429),
      # 结果按池子存下来,总数是所有已知池子的和。一轮扫不完不是问题——日 K 是历史数据。
      # 失败不写零:没刷到的池子沿用上次的值,输出里带 covered/known,前端据此显示 “≥”。
      - run: node scripts/volume-all.mjs
      # SEO 入口页 / sitemap / 404 兜底跟着 ours.json 与当前 index.html 走
      - run: node scripts/seo.mjs
      - name: commit if changed
        run: |
          git config user.name 'boards-snapshot-bot'
          git config user.email 'xiaoa-ai001@users.noreply.github.com'
          # **git add -A，不要再列白名单。**
          #
          # 这里原来是一串显式路径。它两次咬人：
          #   1. seo.mjs 每轮重写 tokenlist.json，而它没在名单里 → 每轮都留一份未暂存改动
          #      → git pull --rebase 拒绝执行 → 整个 job 挂掉。站上代币列表因此冻了 27 小时。
          #   2. 名单里只有 explore/launch/fees/bridge/points 五个静态页，而 seo.mjs 实际生成
          #      十三个。changelog、docs、treasury、partners、affiliate… 全部在 runner 上
          #      生成完就被丢掉 —— /changelog 深链接因此一直加载几个版本之前的 bundle，
          #      发了新公告也看不见。
          #
          # 第 2 条更阴：加上 --autostash 之后它连 job 都不会挂了，改动被静默 stash 掉，
          # 日志一片绿。白名单和脚本产物之间没有任何机制保证同步，迟早再次漂移。
          # 这个仓库在 runner 上的全部内容非 checkout 即脚本产物，直接全量 add 才是对的。
          git add -A
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m 'data: boards snapshot'
          # --autostash：万一以后哪个脚本又写了白名单之外的文件，rebase 会自动把它收起来再放回去，
          # 而不是整个 job 失败。上面那次事故的真正教训不是"漏了一个文件名"，而是"漏一个就全挂，
          # 且挂得无声无息"。
          # -X theirs：两个 job 撞车时（我推代码 / 另一个 cron 同时在跑），双方都改
          # data/*.json，rebase 会内容冲突然后整个 job 挂掉 —— 2026-08-18 就这么挂过一次。
          # 快照类数据没有"合并"的语义，最后跑完的那份就是最新的，直接让它覆盖。
          # （rebase 期间 theirs = 正在重放的我方提交，也就是本轮新生成的快照。）
          git pull --rebase --autostash -X theirs origin main
          # **rebase 之后必须再生成一次。** 上面那次 seo.mjs 用的模板是 checkout 那一刻的
          # index.html，而这个 job 中间要跑好几分钟的链上扫描和行情（08-20 那轮 11:03:24 开始、
          # 11:11:25 才推）。这期间只要发布过一次（那轮是 11:07:31），刚 pull 进来的 index.html
          # 就已经是新哈希了，而我们手里这 1038 个页面还钉着旧的 —— 它们照样 200，因为发布侧
          # 故意不带 --delete，旧 assets 还在。于是分享链接打开的是几个版本之前的 App，不报错。
          #
          # 上面那个 -X theirs 让这件事更糟：撞车时优先我方，也就是优先这一份**过期的**模板。
          # 重新生成一次就与谁赢无关了 —— 判据变成「以最终会被推上去的那份 index.html 为准」。
          # 脚本是 (index.html, data/ours.json) 的纯函数、不联网、0.3 秒，重跑没有代价。
          node scripts/seo.mjs
          git add -A
          git diff --cached --quiet || git commit --amend --no-edit
          git push origin main
