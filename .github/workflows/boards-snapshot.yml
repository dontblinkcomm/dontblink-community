# Refresh /data/boards.json every ~10 min. Pages rebuilds on each commit;
# the legacy branch build has a ~10 builds/hour soft limit, so keep the cron
# at 10 min or slower.
name: boards-snapshot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boards-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/snapshot.mjs
      # 我们自己发出去的币（v1 存档 + 链上增量 + v2 Portal 事件 + GT 行情）
      - run: node scripts/ours.mjs
      # SEO 入口页 / sitemap / 404 兜底跟着 ours.json 与当前 index.html 走
      - run: node scripts/seo.mjs
      - name: commit if changed
        run: |
          git config user.name 'boards-snapshot-bot'
          git config user.email 'xiaoa-ai001@users.noreply.github.com'
          # **git add -A，不要再列白名单。**
          #
          # 这里原来是一串显式路径。它两次咬人：
          #   1. seo.mjs 每轮重写 tokenlist.json，而它没在名单里 → 每轮都留一份未暂存改动
          #      → git pull --rebase 拒绝执行 → 整个 job 挂掉。站上代币列表因此冻了 27 小时。
          #   2. 名单里只有 explore/launch/fees/bridge/points 五个静态页，而 seo.mjs 实际生成
          #      十三个。changelog、docs、treasury、partners、affiliate… 全部在 runner 上
          #      生成完就被丢掉 —— /changelog 深链接因此一直加载几个版本之前的 bundle，
          #      发了新公告也看不见。
          #
          # 第 2 条更阴：加上 --autostash 之后它连 job 都不会挂了，改动被静默 stash 掉，
          # 日志一片绿。白名单和脚本产物之间没有任何机制保证同步，迟早再次漂移。
          # 这个仓库在 runner 上的全部内容非 checkout 即脚本产物，直接全量 add 才是对的。
          git add -A
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m 'data: boards snapshot'
          # --autostash：万一以后哪个脚本又写了白名单之外的文件，rebase 会自动把它收起来再放回去，
          # 而不是整个 job 失败。上面那次事故的真正教训不是"漏了一个文件名"，而是"漏一个就全挂，
          # 且挂得无声无息"。
          # -X theirs：两个 job 撞车时（我推代码 / 另一个 cron 同时在跑），双方都改
          # data/*.json，rebase 会内容冲突然后整个 job 挂掉 —— 2026-08-18 就这么挂过一次。
          # 快照类数据没有"合并"的语义，最后跑完的那份就是最新的，直接让它覆盖。
          # （rebase 期间 theirs = 正在重放的我方提交，也就是本轮新生成的快照。）
          git pull --rebase --autostash -X theirs origin main
          git push origin main
