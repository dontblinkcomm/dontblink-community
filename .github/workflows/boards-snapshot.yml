# Refresh /data/boards.json every ~10 min. Pages rebuilds on each commit;
# the legacy branch build has a ~10 builds/hour soft limit, so keep the cron
# at 10 min or slower.
name: boards-snapshot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boards-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/snapshot.mjs
      # 我们自己发出去的币（v1 存档 + 链上增量 + v2 Portal 事件 + GT 行情）
      - run: node scripts/ours.mjs
      # SEO 入口页 / sitemap / 404 兜底跟着 ours.json 与当前 index.html 走
      - run: node scripts/seo.mjs
      - name: commit if changed
        run: |
          git config user.name 'boards-snapshot-bot'
          git config user.email 'xiaoa-ai001@users.noreply.github.com'
          git add data/boards.json data/ours.json sitemap.xml robots.txt 404.html t curve drop img explore launch fees bridge points
          git diff --cached --quiet && echo 'no change' && exit 0
          git commit -m 'data: boards snapshot'
          git pull --rebase origin main
          git push origin main
