<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>WINK Finalize — dontblink</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #05060b; --panel: #0c0e18; --panel2: #12142275;
    --line: #22243a; --text: #eceaff; --muted: #7c8093;
    --accent: #7b6cf6; --accent-deep: #5b46d6; --good: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Instrument Sans", system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-family: Quicksand, sans-serif; font-size: 24px; }
  h2 { font-family: Quicksand, sans-serif; font-size: 15px; margin-bottom: 10px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin: 6px 0 20px; line-height: 1.6; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font: 600 14px "Instrument Sans", sans-serif; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text] { background: #090a12; border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: 500 15px "JetBrains Mono", monospace; padding: 12px; width: 100%; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
  label.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin-top: 10px; line-height: 1.5; }
  #logoPrev { width: 96px; height: 96px; border-radius: 20px; border: 1px solid var(--line); object-fit: cover; display: none; }
  #msg { font-family: "JetBrains Mono", monospace; font-size: 12px; margin-top: 10px; word-break: break-all; white-space: pre-wrap; }
  .ok { color: var(--good); }
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; }
</style>
<div class="wrap">
  <h1>WINK · 正式发射资料提交</h1>
  <p class="sub">这一页把你们的最终确认和 Logo 打包成<b>一笔链上交易</b>(发到 dontblink 的链上收件箱合约)。签名的钱包即身份;上链即存档,双方各持一份带时间戳、不可抵赖的凭证 —— 不走聊天传文件。费用只有一点 gas。</p>

  <div class="card">
    <h2>① 确认项</h2>
    <label class="chk"><input type="checkbox" id="c1"> 机制确认单(数例+资金流图版)确认无异议</label>
    <label class="chk"><input type="checkbox" id="c2"> 开盘 FDV $5,800(tick -174552 ≈ 26.28 NVDA)与八档成本表确认</label>
    <label class="chk"><input type="checkbox" id="c3"> 托管受益地址 = 托管触发人 = 0xB226…d512(长期自控钱包)确认</label>
    <label class="chk"><input type="checkbox" id="c4"> 名称/符号 WINK · 官网 winkwink.pages.dev · TG t.me/WinkCTO_Official 确认</label>
    <label class="chk"><input type="checkbox" id="c5"> 我们自己发射;等待你们私下交付的 salt 与完整参数</label>
  </div>

  <div class="card">
    <h2>② 正式 Logo</h2>
    <div class="drop" id="drop">点击或拖入 Logo 图片(将自动压缩为链上可存的小图)</div>
    <input type="file" id="file" accept="image/*" style="display:none">
    <div class="row"><img id="logoPrev"><span class="note" id="logoInfo"></span></div>
  </div>

  <div class="card">
    <h2>③ 备注(可选)</h2>
    <input type="text" id="memo" placeholder="有任何补充写这里,一并上链">
    <div class="row" style="margin-top:16px">
      <button id="connect">连接钱包</button>
      <button id="submit" disabled>签名并上链提交</button>
    </div>
    <div id="msg"></div>
  </div>
</div>
<script>
(() => {
  const RPC = "https://rpc.mainnet.chain.robinhood.com";
  const CHAIN_HEX = "0x1237";
  const INBOX = "0xD9636677259a1a5d38dAA559289E26620A2c92c6";
  const SEL = "0x3d5376fa"; // submit(bytes32,bytes)
  const TOPIC = "77696e6b2d66696e616c2d323032363039313000000000000000000000000000"; // "wink-final-20260910"
  let acct = null, logoDataUri = null, id = 0;
  const $ = (i) => document.getElementById(i);
  const msg = (t) => ($("msg").textContent = t);

  const rpc = async (m, p) => {
    const r = await fetch(RPC, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: ++id, method: m, params: p }) });
    const j = await r.json(); if (j.error) throw new Error(j.error.message); return j.result;
  };

  const gate = () => {
    const all = ["c1","c2","c3","c4","c5"].every((c) => $(c).checked);
    $("submit").disabled = !(acct && all && logoDataUri);
  };
  ["c1","c2","c3","c4","c5"].forEach((c) => $(c).addEventListener("change", gate));

  $("drop").onclick = () => $("file").click();
  $("file").onchange = () => {
    const f = $("file").files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      // 压到 256px 内的 webp;>28KB 逐级降质(calldata 便宜但别浪费)
      const S = 256, c = document.createElement("canvas");
      const k = Math.min(1, S / Math.max(img.width, img.height));
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let q = 0.9, uri = c.toDataURL("image/webp", q);
      while (uri.length > 38000 && q > 0.3) { q -= 0.15; uri = c.toDataURL("image/webp", q); }
      logoDataUri = uri;
      $("logoPrev").src = uri; $("logoPrev").style.display = "block";
      $("logoInfo").textContent = `已压缩:${c.width}×${c.height} · ${(uri.length/1024).toFixed(1)}KB · 上链即为正式链上元数据用图`;
      gate();
    };
    img.src = URL.createObjectURL(f);
  };

  $("connect").onclick = async () => {
    if (!window.ethereum) return msg("未检测到钱包 —— 请在钱包内置浏览器打开");
    try { await ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN_HEX }] }); }
    catch (e) { if (e.code === 4902) await ethereum.request({ method: "wallet_addEthereumChain", params: [{
      chainId: CHAIN_HEX, chainName: "Robinhood Chain", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
      rpcUrls: [RPC], blockExplorerUrls: ["https://robinhoodchain.blockscout.com"] }] }); }
    [acct] = await ethereum.request({ method: "eth_requestAccounts" });
    $("connect").textContent = acct.slice(0, 8) + "… 已连接";
    gate();
  };

  const padN = (n) => n.toString(16).padStart(64, "0");
  $("submit").onclick = async () => {
    const payload = JSON.stringify({
      form: "wink-final", ts: Date.now(),
      confirms: { mechanism: true, fdv5800_tick_174552: true, addresses_b226: true, materials: true, self_launch: true },
      memo: $("memo").value.trim(), logo: logoDataUri,
    });
    const bytes = new TextEncoder().encode(payload);
    let hex = ""; bytes.forEach((b) => (hex += b.toString(16).padStart(2, "0")));
    const padded = hex.padEnd(Math.ceil(bytes.length / 32) * 64, "0");
    const data = SEL + TOPIC + padN(64n) + padN(BigInt(bytes.length)) + padded;
    msg("发送中…");
    try {
      const h = await ethereum.request({ method: "eth_sendTransaction", params: [{ from: acct, to: INBOX, data }] });
      msg("tx " + h + " — 等待确认…");
      for (let i = 0; i < 60; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        const rec = await rpc("eth_getTransactionReceipt", [h]);
        if (rec) return msg((rec.status === "0x1" ? "✓ 提交成功,已永久存档于链上\n" : "✗ 交易回滚\n") + h);
      }
      msg("等待超时:" + h);
    } catch (e) { msg("已取消或失败:" + (e.message || e)); }
  };
})();
</script>
